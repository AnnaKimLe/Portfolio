  /* Layout: one wide banner, full width of the page column, with a one-line hint underneath.
     Single dark look by choice: the banner is the whole subject. */
  :root {
    --night: #05071f;
    --ice: #dbe9ff;
    --white: #f6faff;
    --haze: #8fb4ff;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  body {
    background: var(--night);
    color: var(--ice);
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.6;
    padding-inline: clamp(16px, 3vw, 40px);
    padding-block: 24px 40px;
  }
  .wrap { max-width: 1680px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; }
  .banner { position: relative; width: 100%; aspect-ratio: 16 / 6; container-type: inline-size; background: #03051a; outline: 1px solid rgba(143, 180, 255, 0.22); overflow: hidden; cursor: crosshair; touch-action: pan-y; }
  .banner canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .ov { position: absolute; pointer-events: none; color: var(--white); text-shadow: 0 0 12px rgba(120, 160, 255, 0.55); }
  .name { font-family: "Alte Haas Grotesk", "Arimo", "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 700; font-style: normal; letter-spacing: 0.02em; font-size: clamp(15px, 3.8cqw, 50px); line-height: 1; }
  .meta { font-size: clamp(7px, 1cqw, 12px); letter-spacing: 0.2em; text-transform: uppercase; margin-top: 0.7em; color: var(--ice); }
  .ov-tl { left: 3.2cqw; top: 4.2cqw; }
  .ov-bl { left: 3.2cqw; bottom: 3.6cqw; }
  .ov-tr { right: 3.2cqw; top: 4.2cqw; text-align: right; }
  .hud { font-size: clamp(6px, 0.9cqw, 11px); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ice); line-height: 1.8; transition: opacity 0.08s linear; font-variant-numeric: tabular-nums; }
  @container (max-width: 520px) { .hud-extra { display: none; } }
  .hint { margin: 0; color: #8da6df; letter-spacing: 0.04em; }
  html { color-scheme: dark; }
  body { margin: 0; }
</style>

      hudTrack.textContent = ptr.inside ? 'Track: locked' : 'Track: scanning';
      for (var q = 0; q < huds.length; q++) huds[q].style.opacity = Math.random() < 0.05 ? '0.45' : '1';
    }, 120);
  }

  function init() {
    if (!build()) { setTimeout(init, 100); return; }
    if (reduce) renderOnce(); else start();
    var timer, lastW = S.w;
    if (window.ResizeObserver) {
      new ResizeObserver(function () {
        var wNow = banner.getBoundingClientRect().width;
        if (Math.abs(wNow - lastW) < 2) return;
        lastW = wNow; clearTimeout(timer);
        timer = setTimeout(function () { build(); if (reduce) renderOnce(); }, 150);
      }).observe(banner);
    }
    if (window.IntersectionObserver) {
      new IntersectionObserver(function (en) {
        visible = en[0].isIntersecting;
        if (visible) start(); else stop();
      }).observe(banner);
    }
  }

  var fontP = (document.fonts && document.fonts.load)
    ? Promise.all([
        document.fonts.load('500 12px "JetBrains Mono"'),
        document.fonts.load('700 40px "Alte Haas Grotesk"')
      ]).catch(function () {}) : Promise.resolve();
  var imgP = new Promise(function (res) { img.onload = res; img.onerror = res; img.src = SRC; });
  Promise.all([imgP, Promise.race([fontP, new Promise(function (r) { setTimeout(r, 2500); })])]).then(init);
})();
</script>
